name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx astro check

      - name: Regenerate assets
        # Both read their values from site.ts and the stylesheet, so they must
        # run *before* the build: they write into public/, which the build then
        # copies into dist/. Running them afterwards would change nothing served.
        run: |
          node scripts/make-icons.mjs
          node scripts/make-og.mjs

      - name: Build
        run: bun run build

      # Browser-driven checks. Chromium is already on the runner, so these cost
      # nothing. The preview server serves the site under its own base path.
      - name: Check — a11y, layout and touch
        run: |
          bunx astro preview --port 4321 &
          npx --yes wait-on http://127.0.0.1:4321/dresume/ --timeout 60000
          node scripts/probe-contrast.mjs http://127.0.0.1:4321/dresume/ light
          node scripts/probe-contrast.mjs http://127.0.0.1:4321/dresume/ dark
          node scripts/probe-responsive.mjs http://127.0.0.1:4321/dresume/
          node scripts/probe-occlusion.mjs http://127.0.0.1:4321/dresume/
          node scripts/probe-menu.mjs http://127.0.0.1:4321/dresume/
          node scripts/probe-zoom.mjs http://127.0.0.1:4321/dresume/ 2
          bunx astro preview stop

      # Reports without failing, so placeholder content can still be deployed
      # from a branch. Flip this to `--strict` once site.ts holds real identity —
      # that is the moment the site becomes publishable rather than a preview.
      - name: Check — content gate (advisory)
        run: node scripts/probe-content.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
